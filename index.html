    <script>
      // Apply saved theme, motion and text size before first paint (no flash of the wrong theme).
      (function () {
        var d = document.documentElement;
        var mq = function (q) {
          try {
            return matchMedia(q).matches;
          } catch (e) {
            return false;
          }
        };
        var p = {};
        try {
          p = JSON.parse(localStorage.getItem('p4cards.prefs') || '{}') || {};
        } catch (e) {}
        var dark = p.theme === 'dark' || (p.theme !== 'light' && mq('(prefers-color-scheme: dark)'));
        var calm = p.motion === 'reduce' || (p.motion !== 'full' && mq('(prefers-reduced-motion: reduce)'));
        d.setAttribute('data-theme', dark ? 'lamplight' : 'parchment');
        d.setAttribute('data-motion', calm ? 'reduce' : 'full');
        if (p.text === 'sm' || p.text === 'lg') d.setAttribute('data-text', p.text);
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#17130f');
      })();
    </script>
